name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore EasyDay.slnx

      - name: Build
        run: dotnet build EasyDay.slnx -c Release --no-restore

      - name: Test
        run: dotnet test EasyDay.slnx -c Release --no-build
